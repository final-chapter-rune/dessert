name: 部署到 GitHub Pages

on:
  push:
    branches: ['main']      # push 到 main 时自动部署
  workflow_dispatch:         # 也允许手动触发

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 安装依赖
        run: npm ci

      - name: 打包
        run: npm run build

      - name: 上传 dist 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: 部署到 Pages
        uses: actions/deploy-pages@v4
